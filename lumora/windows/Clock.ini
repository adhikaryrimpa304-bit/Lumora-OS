[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
; Double-click = 12-hour, middle-click = 24-hour
LeftMouseDoubleClickAction=[!WriteKeyValue Variables HourFmt I][!WriteKeyValue Variables DateFmt "%a %d %b - %p"][!Refresh]
MiddleMouseUpAction=[!WriteKeyValue Variables HourFmt H][!WriteKeyValue Variables DateFmt "%a %d %b"][!Refresh]

[Variables]
HourFmt=H
DateFmt=%a %d %b

[MeasureHour]
Measure=Time
Format=%#HourFmt#

[MeasureMin]
Measure=Time
Format=%M

[MeasureDate]
Measure=Time
Format=#DateFmt#

[MeasureSec]
Measure=Time

[MeterRing]
Meter=Shape
Shape=Ellipse 120,120,98 | Fill Color 19,11,32,170 | StrokeWidth 0
Shape2=Arc 107.3,16.8,107.3,223.2,104,104,0,0,0 | Fill Color 0,0,0,0 | StrokeWidth 10 | Stroke Color 176,38,255 | StrokeStartCap Round | StrokeEndCap Round
Shape3=Arc 132.7,16.8,132.7,223.2,104,104,0,1,0 | Fill Color 0,0,0,0 | StrokeWidth 10 | Stroke Color 0,240,255 | StrokeStartCap Round | StrokeEndCap Round
Shape4=Ellipse (120+104*Cos(([MeasureSec] % 60)*0.10471976-1.5707963)),(120+104*Sin(([MeasureSec] % 60)*0.10471976-1.5707963)),11 | Fill Color 255,255,255,60 | StrokeWidth 0
Shape5=Ellipse (120+104*Cos(([MeasureSec] % 60)*0.10471976-1.5707963)),(120+104*Sin(([MeasureSec] % 60)*0.10471976-1.5707963)),6 | Fill Color 216,166,255 | StrokeWidth 0
DynamicVariables=1

[MeterHour]
Meter=String
MeasureName=MeasureHour
X=111
Y=112
StringAlign=RightCenter
FontFace=Inter
FontSize=28
FontWeight=700
FontColor=176,38,255
AntiAlias=1

[MeterColon]
Meter=String
Text=:
X=120
Y=110
StringAlign=CenterCenter
FontFace=Inter
FontSize=28
FontColor=169,152,201
AntiAlias=1

[MeterMin]
Meter=String
MeasureName=MeasureMin
X=129
Y=112
StringAlign=LeftCenter
FontFace=Inter
FontSize=28
FontWeight=700
FontColor=0,240,255
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=120
Y=146
StringAlign=CenterCenter
FontFace=Inter
FontSize=10
FontColor=169,152,201
AntiAlias=1
